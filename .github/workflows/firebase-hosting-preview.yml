name: Preview Deploy to Firebase Hosting

# Deploys the built frontend to a TEMPORARY Firebase Hosting preview channel
# (never the live site) for any pull request targeting main. The
# action-hosting-deploy action posts the preview URL as a comment on the PR, so
# reviewers can open the change on a phone without running anything locally.
#
# Uses the same repository secret as the live deploy:
#   FIREBASE_SERVICE_ACCOUNT  – service account with Firebase Hosting Admin on
#                               jewel-ledger (channel deploys are covered by it).
# Optional build-time secrets mirror the live workflow so the preview matches
# production behaviour:
#   GEMINI_API_KEY, VITE_SENTRY_DSN
#
# Preview channels auto-expire (7 days here); the live site is untouched.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy to a Firebase Hosting preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: jewel-ledger
          expires: 7d
