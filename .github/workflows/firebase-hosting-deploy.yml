name: Deploy to Firebase Hosting

# Deploys the built frontend (dist/) to Firebase Hosting (project: jewel-ledger).
# Runs automatically on every push to main, and can be triggered manually from
# the Actions tab (workflow_dispatch).
#
# Requires one repository secret:
#   FIREBASE_SERVICE_ACCOUNT  – JSON key for a service account with the
#                               "Firebase Hosting Admin" role on jewel-ledger.
# Optional:
#   GEMINI_API_KEY            – exposed to the build for in-app AI features.
#   VITE_SENTRY_DSN           – Sentry DSN for frontend error tracking. When
#                               absent, Sentry stays disabled (safe no-op).
#                               (Configured — frontend error tracking is live.)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys; a newer push cancels an in-flight run.
concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `vite build` does not typecheck, so a type error would otherwise ship.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests
        run: npm test

      - name: Build frontend
        run: npx vite build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # The demo build ships fixture data; this asserts none of it reached the
      # production bundle before that bundle goes live.
      - name: Verify no demo fixtures in the bundle
        run: npm run verify:no-demo

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: jewel-ledger
