# Instagram: post approved posts when due, approve a week, weekly numbers.
# See marketing/social/README.md. Does nothing until the IG_USER_ID and
# IG_ACCESS_TOKEN secrets exist.
name: Social posts

on:
  schedule:
    - cron: "5,35 * * * *"    # post anything approved and due
    - cron: "15 11 * * 0"     # Sunday 4:45 pm IST: numbers into performance.md
  workflow_dispatch:
    inputs:
      action:
        description: "approve, publish or insights"
        type: choice
        options: [approve, publish, insights]
        default: approve
      week:
        description: "Week to approve, e.g. 2026-W50"
        required: false
      posts:
        description: "Which posts: all, or numbers like 1,2,4"
        required: false
        default: all

permissions:
  contents: write

concurrency:
  group: social-posts
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event.schedule == '15 11 * * 0' && 'insights' || 'publish') }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Approve
        if: env.ACTION == 'approve'
        env:
          WEEK: ${{ inputs.week }}
          POSTS: ${{ inputs.posts }}
        run: |
          set -euo pipefail
          [[ "$WEEK" =~ ^[0-9]{4}-W[0-9]{2}$ ]] || { echo "week must look like 2026-W50"; exit 1; }
          [[ "$POSTS" =~ ^(all|[0-9a-z,-]+)$ ]] || { echo "posts must be all or numbers like 1,2,4"; exit 1; }
          dir="marketing/social/weeks/$WEEK"
          # The weekly drafting session pushes each week to social/<week>: bring it to main.
          if [ ! -f "$dir/schedule.json" ] && git ls-remote --exit-code origin "refs/heads/social/$WEEK" >/dev/null; then
            git fetch origin "social/$WEEK"
            git checkout FETCH_HEAD -- "$dir"
          fi
          node marketing/social/publish.mjs approve "$WEEK" "$POSTS"

      - name: Google Cloud credentials (media hosting)
        if: env.ACTION == 'publish' && env.IG_ACCESS_TOKEN != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: env.ACTION == 'publish' && env.IG_ACCESS_TOKEN != ''

      - name: Publish due posts
        if: env.ACTION == 'publish'
        run: node marketing/social/publish.mjs publish

      - name: Weekly numbers
        if: env.ACTION == 'insights'
        run: node marketing/social/publish.mjs insights

      - name: Save status
        run: |
          git add marketing/social
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "sitetru-social"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Social: $ACTION ($(date -u +%FT%RZ))"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*10)); done
          exit 1
