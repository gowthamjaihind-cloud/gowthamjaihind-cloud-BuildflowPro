name: Deploy Firestore & Storage Rules

# Deploys Firestore AND Cloud Storage security rules (project: jewel-ledger).
# Firestore rules go to the app's NAMED
# database — not "(default)" — as configured in firebase.json under "firestore".
# MANUAL trigger only (Actions tab -> "Deploy Firestore Rules" -> Run workflow,
# from the GitHub mobile app or web). Rules are security-sensitive and the first
# cutover must happen AFTER the org owner has claimed the organization (Settings
# -> Claim organization) — otherwise the web app is locked out of its own data
# until the claim. Deploying is therefore intentional, not automatic on push.
#
# Uses the SAME repository secret as the other deploy workflows:
#   FIREBASE_SERVICE_ACCOUNT  – JSON key for a service account on jewel-ledger.
# Deploying rules needs the "Firebase Rules Admin" role (roles/firebaserules.admin)
# — or the broad "Editor" role. If the first run fails with a permissions error,
# grant that role to the service account in the Google Cloud console (IAM).

on:
  workflow_dispatch:

# Never run two rules deploys at once.
concurrency:
  group: firebase-rules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore and Storage rules
        run: npx firebase-tools@latest deploy --only firestore:rules,storage --project jewel-ledger --non-interactive --force

      # Indexes and TTL policies (firestore.indexes.json). No --force: with it
      # the CLI deletes any index that exists in the project but not in the
      # file, such as one made in the console. Runs after the rules, so a
      # problem here never holds the rules back.
      - name: Deploy Firestore indexes and TTL policies
        run: npx firebase-tools@latest deploy --only firestore:indexes --project jewel-ledger --non-interactive

      # Lets the website read photos cross-origin (storage.cors.json). The
      # printable progress report loads photos that way so its PDF export can
      # draw them; without this the browser refuses every photo there.
      # Needs the service account to hold Storage Admin on the bucket.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Apply Storage CORS settings
        run: gcloud storage buckets update gs://jewel-ledger.firebasestorage.app --cors-file=storage.cors.json --project jewel-ledger
