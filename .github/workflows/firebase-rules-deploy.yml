name: Deploy Firestore Rules

# Deploys Firestore security rules (project: jewel-ledger) to the app's NAMED
# database — not "(default)" — as configured in firebase.json under "firestore".
# MANUAL trigger only (Actions tab -> "Deploy Firestore Rules" -> Run workflow,
# from the GitHub mobile app or web). Rules are security-sensitive and the first
# cutover must happen AFTER the org owner has claimed the organization (Settings
# -> Claim organization) — otherwise the web app is locked out of its own data
# until the claim. Deploying is therefore intentional, not automatic on push.
#
# Uses the SAME repository secret as the other deploy workflows:
#   FIREBASE_SERVICE_ACCOUNT  – JSON key for a service account on jewel-ledger.
# Deploying rules needs the "Firebase Rules Admin" role (roles/firebaserules.admin)
# — or the broad "Editor" role. If the first run fails with a permissions error,
# grant that role to the service account in the Google Cloud console (IAM).

on:
  workflow_dispatch:

# Never run two rules deploys at once.
concurrency:
  group: firebase-rules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        run: npx firebase-tools@latest deploy --only firestore:rules --project jewel-ledger --non-interactive --force
